name: Publish GENESIS Memory to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      pypi_env:
        description: 'Target PyPI repository (pypi or testpypi)'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read
  id-token: write  # Enables PyPI Trusted Publishing (OIDC)

jobs:
  build-and-publish:
    name: Build wheels and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package distribution archives
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.pypi_env == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          skip-existing: true
          # Note: If Trusted Publishing (OIDC) is configured on PyPI, password is automatically handled.
          # If using an API token, set the PYPI_API_TOKEN secret in GitHub repository settings.
          password: ${{ secrets.PYPI_API_TOKEN }}
