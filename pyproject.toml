[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-memory"
version = "0.14.3"
description = "Universal Cognitive Memory OS, Zero-Trust Privacy Shield & Stateless Token-Diet Gateway for every AI coding agent"
readme = "README.md"
authors = [
    { name = "GENESIS Team" }
]
license = { text = "Business Source License 1.1" }
requires-python = ">=3.10"
# Only aiohttp is imported anywhere in this package (proxy gateway +
# eval harness). The rest were undeclared-dependency dead weight: every
# install paid their download + supply-chain surface for zero usage.
dependencies = [
    "aiohttp>=3.8.0",
]

[project.urls]
Homepage = "https://hamidrezaeian.github.io/genesis-memory-site/"
Documentation = "https://hamidrezaeian.github.io/genesis-memory-site/"
Repository = "https://github.com/HamidRezaeian/genesis-memory"
"Issue Tracker" = "https://github.com/HamidRezaeian/genesis-memory/issues"
Changelog = "https://github.com/HamidRezaeian/genesis-memory/blob/main/RELEASE_CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
genesis = "genesis_memory.cli.run:main"
genesis-daemon = "genesis_memory.daemon.server:main"
genesis-proxy = "genesis_memory.proxy.launcher:main"
genesis-sleep = "genesis_memory.sleep.sleep_daemon:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["genesis_memory*"]

[tool.setuptools.package-data]
"genesis_memory" = ["data/llms.txt", "data/openapi.json", "data/output_governor_rules.json"]
"genesis_memory.proxy" = ["pricing_catalog.json"]
"genesis_memory.cli" = ["templates/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore::DeprecationWarning:aiohttp.*"]
