[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-memory"
version = "0.10.0"
description = "Universal Cognitive Memory OS, Zero-Trust Privacy Shield & Stateless Token-Diet Gateway for every AI coding agent"
readme = "README.md"
authors = [
    { name = "GENESIS Team" }
]
license = { text = "Business Source License 1.1" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
genesis = "genesis_memory.cli.run:main"
genesis-daemon = "genesis_memory.daemon.server:main"
genesis-proxy = "genesis_memory.proxy.launcher:main"
genesis-sleep = "genesis_memory.sleep.sleep_daemon:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["genesis_memory*"]

[tool.setuptools.package-data]
"genesis_memory" = ["data/llms.txt", "data/openapi.json"]
"genesis_memory.proxy" = ["pricing_catalog.json"]
"genesis_memory.cli" = ["templates/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore::DeprecationWarning:aiohttp.*"]
